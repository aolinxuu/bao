<script>
(function(){
var items = [
      { id: 'date', label: 'Date night', ask: 'Date night in Hayes Valley. Somewhere special?', place: 'Rich Table · Hayes Valley', reply: 'Candlelit, with bar seats held for walk-ins. Order the porcini doughnuts and the aged beef wonton.' },
      { id: 'friends', label: 'With friends', ask: '6 of us tonight in the Mission. Fun and shareable?', place: 'Prubechu · Mission', reply: 'Chamorro food built for sharing, and big tables often open a day ahead. Get the ko’ko’ wings and the BBQ.' },
      { id: 'travel', label: 'Traveling', ask: 'Just landed near Union Square, eating solo. What’s worth it?', place: 'Mensho Tokyo · Union Square', reply: 'Small counter spot, easy alone. Get the tori paitan with chashu.' },
      { id: 'work', label: 'Work dinner', ask: 'Dinner for 4 near FiDi. Impressive, good for talking business?', place: 'Kokkari · Jackson Square', reply: 'A business-dinner favorite with a warm, roomy dining room. Share mezze, then the grilled lamb chops.' },
      { id: 'hungry', label: 'Just hungry', ask: 'Want something really good nearby. Surprise me?', place: 'Tony’s Pizza Napoletana · North Beach', reply: 'Award-winning Neapolitan pizza. Get the margherita, and expect a line.' }
    ];
var picked = "date", chips = document.getElementById("chips");
var base = "min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: 'Shantell Sans', cursive; font-size: 15px; font-weight: 600; cursor: pointer; ";
function render(){
  chips.textContent = "";
  items.forEach(function(it){
    var b = document.createElement("button"), on = it.id === picked;
    b.type = "button"; b.textContent = it.label;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.style.cssText = base + (on ? "background: #111111; color: #FFFFFF; border: 2px solid #111111" : "background: #FFFFFF; color: #111111; border: 2px solid #111111");
    b.addEventListener("click", function(){ picked = it.id; render(); });
    chips.appendChild(b);
  });
  var cur = items.filter(function(x){return x.id===picked;})[0];
  document.getElementById("ask").textContent = cur.ask;
  document.getElementById("place").textContent = cur.place;
  document.getElementById("reply").textContent = cur.reply;
}
render();
})();
</script>

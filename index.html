<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bao</title>
<meta name="description" content="Skip the scroll. Bao picks where to eat in San Francisco, and what to order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#FFFFFF;--ink:#111111;--muted:#555550;--btn-bg:#111111;--btn-fg:#FFFFFF;--shadow:rgba(17,17,17,.16)}
@media (prefers-color-scheme: dark){:root{--bg:#141413;--ink:#F4F1EA;--muted:#A39E94;--btn-bg:#F4F1EA;--btn-fg:#111111;--shadow:rgba(0,0,0,.55)}}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,'PingFang SC','Noto Sans SC',sans-serif}
a{color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.page{box-sizing:border-box;min-height:100vh;min-height:100svh;position:relative;overflow:hidden;display:flex;flex-direction:column}
.sky{position:absolute;inset:0;pointer-events:none}
.food{position:absolute;left:var(--l);top:var(--t);width:var(--w);transform:rotate(var(--r));filter:drop-shadow(0 22px 22px var(--shadow));animation:float ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(var(--f)) rotate(calc(var(--r) + 4deg))}}
nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px}
.logo{display:flex;align-items:center;gap:6px;font-family:'Shantell Sans','ZCOOL KuaiLe',cursive;font-size:24px;font-weight:700}
.lang{min-width:44px;height:44px;border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.pill{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.navcta{margin-left:8px;height:44px;padding:0 20px;font-size:15px}
main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:24px 20px 64px}
.word{display:block;width:clamp(300px,46vw,600px);height:auto;overflow:visible}
h1{margin:8px 0 0;font-size:clamp(21px,2.3vw,30px);line-height:1.25;font-weight:500;letter-spacing:-.01em;max-width:24ch;text-wrap:balance}
.ctas{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px}
.cta{height:56px;padding:0 32px;font-size:17px}
.code{display:inline-flex;align-items:center;min-height:44px;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
[hidden]{display:none!important}
dialog{box-sizing:border-box;width:min(400px,calc(100vw - 32px));border:0;border-radius:24px;padding:28px 24px 24px;background:var(--bg);color:var(--ink);box-shadow:0 24px 64px var(--shadow)}
dialog::backdrop{background:rgba(17,17,17,.4)}
dialog h2{margin:0 0 18px;font-family:'Shantell Sans',cursive;font-size:26px;font-weight:800}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
dialog input{box-sizing:border-box;height:48px;padding:0 16px;border:1.5px solid var(--muted);border-radius:14px;background:transparent;color:var(--ink);font:inherit;font-size:16px}
dialog input:focus{outline:none;border-color:var(--ink)}
dialog .cta{width:100%;margin-top:6px}
dialog .code{align-self:flex-start;min-height:32px;font-size:14px}
dialog .cta:disabled{opacity:.6;cursor:default}
.msg{margin:0;min-height:1.3em;font-size:14px;color:var(--muted)}
.close{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}
.done{margin:0;font-size:17px;line-height:1.4}
dialog label.sms{flex-direction:row;align-items:flex-start;gap:10px;font-size:12px;font-weight:400;line-height:1.45;color:var(--muted)}
dialog .sms input{width:18px;height:18px;flex:none;margin:1px 0 0;padding:0;accent-color:var(--ink)}
dialog .sms a{color:var(--ink)}
footer{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:13px;color:var(--muted);padding:12px 20px 20px}
footer a{color:var(--muted)}footer a:hover{color:var(--ink)}
@media (max-width:600px){
nav{padding:10px 16px}
.navcta{display:none}
.dsk{display:none}
.page{min-height:max(100svh,780px)}
.food{left:var(--ml);top:var(--mt);width:var(--mw);filter:drop-shadow(0 14px 14px var(--shadow))}
main{justify-content:flex-start;padding:16vh 20px 40px}
.word{width:min(300px,77vw)}
}
@media (prefers-reduced-motion: reduce){.food{animation:none}}
</style>
</head>
<body>
<div class="page">
<div class="sky" aria-hidden="true">
<img class="food" src="img/dishes/pistachio-croissant.webp" alt="" style="--l:4%;--t:9%;--w:clamp(90px,11.72vw,172px);--r:-8deg;--f:-11px;animation-duration:6.5s;animation-delay:-0.0s;--ml:-5%;--mt:6%;--mw:26.67vw">
<img class="food" src="img/dishes/strawberry-bingsu.webp" alt="" style="--l:10%;--t:30%;--w:clamp(77px,10.00vw,147px);--r:5deg;--f:-11px;animation-duration:7.2s;animation-delay:-1.7s;--ml:36%;--mt:69%;--mw:21.54vw">
<img class="food dsk" src="img/dishes/basque-cheesecake.webp" alt="" style="--l:2%;--t:50%;--w:clamp(72px,9.38vw,138px);--r:6deg;--f:-11px;animation-duration:7.9s;animation-delay:-3.4s">
<img class="food" src="img/dishes/ube-latte.webp" alt="" style="--l:19%;--t:52%;--w:clamp(59px,7.66vw,113px);--r:-6deg;--f:-10px;animation-duration:8.6s;animation-delay:-5.1s;--ml:-4%;--mt:39%;--mw:15.90vw">
<img class="food" src="img/dishes/margherita-pizza.webp" alt="" style="--l:-3%;--t:65%;--w:clamp(132px,17.19vw,253px);--r:-7deg;--f:-13px;animation-duration:9.3s;animation-delay:-6.8s;--ml:-10%;--mt:64%;--mw:38.46vw">
<img class="food" src="img/dishes/double-cheeseburger.webp" alt="" style="--l:13%;--t:77%;--w:clamp(96px,12.50vw,184px);--r:5deg;--f:-12px;animation-duration:7.0s;animation-delay:-1.5s;--ml:71%;--mt:64%;--mw:31.79vw">
<img class="food" src="img/dishes/matcha-soft-serve.webp" alt="" style="--l:22%;--t:3%;--w:clamp(48px,6.25vw,92px);--r:-5deg;--f:-10px;animation-duration:7.7s;animation-delay:-3.2s;--ml:33%;--mt:2%;--mw:12.31vw">
<img class="food dsk" src="img/dishes/tonkotsu-ramen.webp" alt="" style="--l:60%;--t:4%;--w:clamp(77px,10.00vw,147px);--r:5deg;--f:-11px;animation-duration:8.4s;animation-delay:-4.9s">
<img class="food" src="img/dishes/thai-iced-tea.webp" alt="" style="--l:74%;--t:13%;--w:clamp(53px,6.88vw,101px);--r:7deg;--f:-10px;animation-duration:9.1s;animation-delay:-6.6s;--ml:58%;--mt:5%;--mw:14.87vw">
<img class="food" src="img/dishes/xiaolongbao.webp" alt="" style="--l:84%;--t:10%;--w:clamp(98px,12.81vw,189px);--r:-5deg;--f:-12px;animation-duration:6.8s;animation-delay:-1.3s;--ml:76%;--mt:8%;--mw:26.67vw">
<img class="food" src="img/dishes/sushi-nigiri-set.webp" alt="" style="--l:76%;--t:35%;--w:clamp(74px,9.69vw,143px);--r:8deg;--f:-11px;animation-duration:7.5s;animation-delay:-3.0s;--ml:86%;--mt:40%;--mw:15.90vw">
<img class="food dsk" src="img/dishes/souffle-pancakes.webp" alt="" style="--l:88%;--t:41%;--w:clamp(90px,11.72vw,172px);--r:4deg;--f:-11px;animation-duration:8.2s;animation-delay:-4.7s">
<img class="food" src="img/dishes/oysters.webp" alt="" style="--l:71%;--t:63%;--w:clamp(103px,13.44vw,198px);--r:-4deg;--f:-12px;animation-duration:8.9s;animation-delay:-6.4s;--ml:74%;--mt:78%;--mw:25.64vw">
<img class="food dsk" src="img/dishes/churros.webp" alt="" style="--l:86%;--t:75%;--w:clamp(112px,14.53vw,214px);--r:8deg;--f:-12px;animation-duration:6.6s;animation-delay:-1.1s">
<img class="food" src="img/dishes/bubble-waffle-cone.webp" alt="" style="--l:27%;--t:76%;--w:clamp(38px,5.00vw,74px);--r:-6deg;--f:-10px;animation-duration:7.3s;animation-delay:-2.8s;--ml:4%;--mt:78%;--mw:12.82vw">
<img class="food" src="img/dishes/mochi-assortment.webp" alt="" style="--l:57%;--t:83%;--w:clamp(83px,10.78vw,159px);--r:-3deg;--f:-11px;animation-duration:8.0s;animation-delay:-4.5s;--ml:44%;--mt:80%;--mw:25.64vw">
</div>
<nav>
<div class="logo"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36c0-13 10-22 22-22s22 9 22 22c0 6-8 10-22 10S10 42 10 36z"></path><path d="M32 15c-1-3 1-6 4-6M32 15c-5 2-8 5-10 9M32 15c-1.5 3-1.5 6 0 9M32 15c5 2 8 5 10 9"></path><circle cx="25" cy="32" r="1.8" fill="currentColor" stroke="none"></circle><circle cx="39" cy="32" r="1.8" fill="currentColor" stroke="none"></circle><path d="M30 36q2 2 4 0"></path></svg><span>bao</span></div>
<div style="display:flex;align-items:center;gap:4px">
<button class="lang">中文</button>
<button class="lang" style="font-weight:700;color:var(--ink)">EN</button>
<button class="pill navcta" data-open>Join the waitlist</button>
</div>
</nav>
<main>
<svg class="word" role="img" aria-label="bao" viewBox="0 0 620 250" focusable="false"><text x="300" y="196" text-anchor="middle" font-family="'Shantell Sans', 'ZCOOL KuaiLe', cursive" font-weight="800" font-size="230" letter-spacing="-4" fill="currentColor">bao</text></svg>
<h1>Skip the scroll. Bao picks where to eat in SF, and what to order.</h1>
<div class="ctas">
<button class="pill cta" data-open>Join the waitlist</button>
<button class="code" data-open="code">Have a code?</button>
</div>
</main>
<footer><span>© 2026 Bao</span><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="sms-terms.html">SMS terms</a><a href="mailto:[CONTACT EMAIL]">[CONTACT EMAIL]</a></footer>
</div>
<dialog id="join" aria-labelledby="join-title">
<button class="close" aria-label="Close" data-close>×</button>
<h2 id="join-title">Join the waitlist</h2>
<form>
<label>Phone number<input name="phone" type="tel" autofocus autocomplete="tel" placeholder="+1 415 555 0123" required></label>
<button type="button" class="code" data-show-code>Have a code?</button>
<label hidden>Access code<input name="code" autocomplete="off"></label>
<label class="sms"><input type="checkbox" name="sms" value="yes"><span>Text me about Bao by SMS. Message frequency varies. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help. <a href="sms-terms.html" target="_blank">SMS terms</a></span></label>
<p class="msg" role="status"></p>
<button class="pill cta">Join</button>
</form>
<p class="done" hidden>You're on the waitlist. We'll message you when it's your turn.</p>
</dialog>
<script>
const dlg=document.getElementById('join'),form=dlg.querySelector('form'),codeBtn=form.querySelector('[data-show-code]'),codeField=form.code.parentElement
function showCode(){codeBtn.hidden=true;codeField.hidden=false}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open==='code')showCode();dlg.showModal()})
dlg.querySelector('[data-close]').onclick=()=>dlg.close()
codeBtn.onclick=()=>{showCode();form.code.focus()}
form.onsubmit=async e=>{
  e.preventDefault()
  const msg=form.querySelector('.msg'),btn=form.querySelector('.cta')
  btn.disabled=true;msg.textContent=''
  try{
    const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))})
    const d=await r.json().catch(()=>({}))
    if(!r.ok)msg.textContent=d.error||'Something went wrong. Try again.'
    else if(d.url)location.href=d.url
    else{form.hidden=true;form.nextElementSibling.hidden=false}
  }catch{msg.textContent='Something went wrong. Try again.'}
  finally{btn.disabled=false}
}
</script>
</body>
</html>

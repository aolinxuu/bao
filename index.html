<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bao</title>
<meta name="description" content="Skip the scroll. Text Bao on WhatsApp and get a restaurant pick you can trust in San Francisco, plus what to order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one calm column on phones; on wide screens the promise sits left and the live chat demo right. */
:root {
  --bg: #FFFFFF;
  --fg: #111111;
  --muted: #5E5E58;
  --soft: #F1F1EC;
  --line: #D9D9D2;
  --ink-btn: #111111;
  --ink-btn-fg: #FFFFFF;
  --font: "Figtree", "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E0D; --fg: #F3F3EF; --muted: #A3A39B; --soft: #1D1D1B; --line: #34342F;
    --ink-btn: #F3F3EF; --ink-btn-fg: #0E0E0D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E0D; --fg: #F3F3EF; --muted: #A3A39B; --soft: #1D1D1B; --line: #34342F;
  --ink-btn: #F3F3EF; --ink-btn-fg: #0E0E0D; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1040px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
svg.mark { stroke: var(--fg); }
svg.mark .dot { fill: var(--fg); }
nav { display: flex; align-items: center; justify-content: flex-end; padding-block: 12px; }
.lang { display: flex; }
.lang button {
  min-width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px;
}
.lang button[aria-pressed="true"] { color: var(--fg); font-weight: 600; }
.hero { display: grid; gap: 32px; padding-block: 32px 24px; }
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 64px; align-items: start; padding-block: 72px 40px; }
}
.copy { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1 { margin: 0; font-size: clamp(36px, 7vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; max-width: 14ch; }
.sub { margin: 0; font-size: 18px; color: var(--muted); max-width: 34ch; }
.cta { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; max-width: 420px; }
.btn {
  height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 999px;
  background: var(--ink-btn); color: var(--ink-btn-fg); font-weight: 600; font-size: 16px; text-decoration: none;
}
.btn:focus-visible, .chip:focus-visible, .lang button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.note { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.demo { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--bg); color: var(--fg); border: 1.5px solid var(--line);
}
.chip[aria-pressed="true"] { background: var(--ink-btn); color: var(--ink-btn-fg); border-color: var(--ink-btn); }
.chat {
  margin-top: 4px; border: 1.5px solid var(--fg); border-radius: 24px; padding: 20px 16px;
  display: flex; flex-direction: column; gap: 14px; min-height: 210px;
}
.ask {
  align-self: flex-end; max-width: 82%; background: var(--soft); border-radius: 18px 18px 4px 18px;
  padding: 12px 14px; font-size: 16px; line-height: 1.4;
}
.reply { align-self: flex-start; max-width: 90%; display: flex; gap: 8px; align-items: flex-end; }
.reply svg { flex-shrink: 0; }
.bubble { border: 1.5px solid var(--fg); border-radius: 18px 18px 18px 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.place { font-weight: 600; }
.why { font-size: 15px; line-height: 1.45; color: var(--muted); }
.fade { animation: fade .25s ease-out; }
@keyframes fade { from { opacity: .35; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
.friends { display: flex; justify-content: center; gap: 28px; padding-block: 32px 8px; margin-top: auto; }
footer { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); padding-block: 16px 24px; }
footer a { color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="lang">
      <button type="button" id="lang-zh" data-lang="zh" aria-pressed="false" lang="zh">中文</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
    </div>
  </nav>

  <main class="hero">
    <div class="copy">
      <h1 data-i18n="h1">Skip the scroll. Bao picks where to eat.</h1>
      <p class="sub" data-i18n="sub">Text it on WhatsApp. Get a pick you can trust in SF, and what to order.</p>
      <div class="cta">
        <a class="btn" id="cta" href="#join" data-i18n="cta">Get early access</a>
        <p class="note" id="join" data-i18n="note">Now testing in San Francisco.</p>
      </div>
    </div>

    <section class="demo" aria-label="Example conversation">
      <div class="label" data-i18n="planning">What are you planning?</div>
      <div class="chips" id="chips" role="group"></div>
      <div class="chat" aria-live="polite">
        <div class="ask" id="ask"></div>
        <div class="reply">
          <svg class="mark" width="36" height="36" viewBox="0 0 64 64" role="img" aria-label="Bao" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36c0-13 10-22 22-22s22 9 22 22c0 6-8 10-22 10S10 42 10 36z"/><path d="M32 15c-1-3 1-6 4-6M32 15c-5 2-8 5-10 9M32 15c-1.5 3-1.5 6 0 9M32 15c5 2 8 5 10 9"/><circle class="dot" cx="25" cy="32" r="1.6" stroke="none"/><circle class="dot" cx="39" cy="32" r="1.6" stroke="none"/><path d="M30 36q2 2 4 0"/><path d="M11 37l-6 5M53 34l5-8M58 26l1-3M58 26l3-1"/><path d="M26 45v8h-3M38 45v8h3"/></svg>
          <div class="bubble" id="bubble">
            <div class="place" id="place"></div>
            <div class="why" id="why"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="friends" aria-hidden="true">
    <svg class="mark" width="56" height="56" viewBox="0 0 64 64" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40c0-12 10-20 22-20s22 8 22 20z"/><path d="M22 24l2 4M32 20v5M42 24l-2 4"/><circle class="dot" cx="27" cy="32" r="1.3" stroke="none"/><circle class="dot" cx="37" cy="32" r="1.3" stroke="none"/><path d="M24 40l-3 12h-4M40 40l3 12h4"/><path d="M52 32l6-10M12 34l-6 6"/></svg>
    <svg class="mark" width="56" height="56" viewBox="0 0 64 64" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36c0-13 10-22 22-22s22 9 22 22c0 6-8 10-22 10S10 42 10 36z"/><path d="M32 15c-1-3 1-6 4-6M32 15c-5 2-8 5-10 9M32 15c-1.5 3-1.5 6 0 9M32 15c5 2 8 5 10 9"/><circle class="dot" cx="25" cy="32" r="1.5" stroke="none"/><circle class="dot" cx="39" cy="32" r="1.5" stroke="none"/><path d="M30 36q2 2 4 0"/><path d="M11 37l-6 5M53 34l5-8M58 26l1-3M58 26l3-1"/><path d="M26 45v8h-3M38 45v8h3"/></svg>
    <svg class="mark" width="56" height="56" viewBox="0 0 64 64" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 14c8-2 14 4 16 12 3 10 9 16 18 18-12 4-26-2-31-12-3-6-4-12-3-18z"/><path d="M18 14c-2-4 0-8 4-9"/><circle class="dot" cx="26" cy="25" r="1.3" stroke="none"/><circle class="dot" cx="31" cy="23" r="1.3" stroke="none"/><path d="M30 42l-5 10M38 44l1 11"/><path d="M21 26l-9-8M44 34l9-8"/></svg>
  </div>

  <footer>
    <span>© 2026 Bao</span>
    <a href="#" data-i18n="privacy">Privacy</a>
    <a href="#" data-i18n="terms">Terms</a>
    <span>hello@[domain]</span>
  </footer>
</div>

<script>
(function () {
  var copy = {
    en: {
      h1: "Skip the scroll. Bao picks where to eat.",
      sub: "Text it on WhatsApp. Get a pick you can trust in SF, and what to order.",
      cta: "Get early access", note: "Now testing in San Francisco.",
      planning: "What are you planning?", privacy: "Privacy", terms: "Terms"
    },
    zh: {
      h1: "别再刷了，Bao 帮你挑好去哪吃。",
      sub: "在 WhatsApp 上发条消息，就能得到旧金山值得信赖的推荐，还有点什么菜。",
      cta: "抢先体验", note: "目前在旧金山测试中。",
      planning: "今天是什么场合？", privacy: "隐私", terms: "条款"
    }
  };
  var items = [
    { id: "date", en: ["Date night", "Date night in Hayes Valley. Somewhere special?", "Rich Table · Hayes Valley", "Candlelit, with bar seats held for walk-ins. Order the porcini doughnuts and the aged beef wonton."],
      zh: ["约会", "海斯谷约会，有没有特别一点的地方？", "Rich Table · 海斯谷", "烛光氛围，吧台座位留给临时到店的客人。点牛肝菌甜甜圈和熟成牛肉馄饨。"] },
    { id: "friends", en: ["With friends", "6 of us tonight in the Mission. Fun and shareable?", "Prubechu · Mission", "Chamorro food built for sharing, and big tables often open a day ahead. Get the ko’ko’ wings and the BBQ."],
      zh: ["朋友聚餐", "今晚 6 个人在 Mission，想热闹点、适合分享的？", "Prubechu · Mission", "查莫罗菜，适合大家分着吃，大桌通常提前一天能订到。点 ko’ko’ 鸡翅和烧烤。"] },
    { id: "travel", en: ["Traveling", "Just landed near Union Square, eating solo. What’s worth it?", "Mensho Tokyo · Union Square", "Small counter spot, easy alone. Get the tori paitan with chashu."],
      zh: ["出差旅行", "刚到联合广场附近，一个人吃，什么值得去？", "Mensho Tokyo · 联合广场", "小小的吧台拉面店，一个人很自在。点鸡白汤叉烧拉面。"] },
    { id: "work", en: ["Work dinner", "Dinner for 4 near FiDi. Impressive, good for talking business?", "Kokkari · Jackson Square", "A business-dinner favorite with a warm, roomy dining room. Share mezze, then the grilled lamb chops."],
      zh: ["商务晚餐", "金融区附近 4 人晚餐，要有面子又方便谈事？", "Kokkari · 杰克逊广场", "商务宴请的热门选择，餐厅宽敞温暖。先分享开胃小菜，再点烤羊排。"] },
    { id: "hungry", en: ["Just hungry", "Want something really good nearby. Surprise me?", "Tony’s Pizza Napoletana · North Beach", "Award-winning Neapolitan pizza. Get the margherita, and expect a line."],
      zh: ["随便吃点", "附近有什么特别好吃的？给我个惊喜。", "Tony’s Pizza Napoletana · 北滩", "得过奖的那不勒斯披萨。点玛格丽特，记得要排队。"] }
  ];
  var lang = "en", picked = "date";
  var chipsEl = document.getElementById("chips");
  var askEl = document.getElementById("ask"), placeEl = document.getElementById("place"), whyEl = document.getElementById("why");
  var bubble = document.getElementById("bubble");

  function renderChips() {
    chipsEl.textContent = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.id = "chip-" + it.id;
      b.textContent = it[lang][0];
      b.setAttribute("aria-pressed", it.id === picked ? "true" : "false");
      b.addEventListener("click", function () { picked = it.id; render(true); });
      chipsEl.appendChild(b);
    });
  }
  function renderChat(animate) {
    var it = items.filter(function (x) { return x.id === picked; })[0];
    askEl.textContent = it[lang][1];
    placeEl.textContent = it[lang][2];
    whyEl.textContent = it[lang][3];
    if (animate) { [askEl, bubble].forEach(function (el) { el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); }); }
  }
  function renderCopy() {
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = copy[lang][el.getAttribute("data-i18n")]; });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
  }
  function render(animate) { renderCopy(); renderChips(); renderChat(animate); }

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("bao-lang", lang); } catch (e) {}
      render(false);
    });
  });
  try { var saved = localStorage.getItem("bao-lang"); if (saved === "zh" || saved === "en") lang = saved; } catch (e) {}
  render(false);
})();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bao</title>
<meta name="description" content="Skip the scroll. Text Bao on WhatsApp and get one restaurant pick you can trust in San Francisco, plus what to order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;overflow-x:hidden}
a{color:#555550}a:hover{color:#111111}
button:focus-visible,a:focus-visible{outline:2px solid #111111;outline-offset:3px}
img{max-width:100%}
html{overflow-x:clip}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,440px);gap:40px 72px;align-items:center}
.food{position:absolute;transform:rotate(var(--r));filter:drop-shadow(0 18px 20px rgba(17,17,17,.16));animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
@media (prefers-reduced-motion: reduce){.food{animation:none}}
@media (max-width: 860px){.hero{grid-template-columns:minmax(0,1fr)}.hero > [aria-hidden]{max-width:300px !important}}
</style>
</head>
<body>
<div style="box-sizing: border-box; min-height: 100vh; min-height: 100svh; background: #FFFFFF; color: #111111; font-family: Figtree, 'PingFang SC', 'Noto Sans SC', sans-serif; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column">
<div style="width: 100%; max-width: 1160px; margin: 0 auto; flex: 1; display: flex; flex-direction: column">

<nav style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0">
<div style="display: flex; align-items: center; gap: 6px; font-family: 'Shantell Sans', 'ZCOOL KuaiLe', cursive; font-size: 26px; font-weight: 700">
<svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36c0-13 10-22 22-22s22 9 22 22c0 6-8 10-22 10S10 42 10 36z"></path><path d="M32 15c-1-3 1-6 4-6M32 15c-5 2-8 5-10 9M32 15c-1.5 3-1.5 6 0 9M32 15c5 2 8 5 10 9"></path><circle cx="25" cy="32" r="1.8" fill="#111111" stroke="none"></circle><circle cx="39" cy="32" r="1.8" fill="#111111" stroke="none"></circle><path d="M30 36q2 2 4 0"></path></svg>
<span>bao</span>
</div>
<div style="display: flex">
<button style="min-width: 44px; height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #555550; cursor: pointer">中文</button>
<button style="min-width: 44px; height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #111111; cursor: pointer">EN</button>
</div>
</nav>

<main class="hero" style="flex: 1; padding: 8px 0 32px">

<div style="min-width: 0; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Shantell Sans', 'ZCOOL KuaiLe', cursive; font-size: clamp(40px, 5.4vw, 70px); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em">Skip the scroll.<br>Bao picks<br><span style="position: relative; display: inline-block; white-space: nowrap">where to eat.<svg viewBox="0 0 400 130" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -16px; top: 2px; width: calc(100% + 32px); height: calc(100% + 6px); overflow: visible; pointer-events: none"><path d="M40 20 C 140 2, 320 4, 380 30 C 410 60, 380 112, 250 122 C 140 130, 20 118, 10 76 C 2 44, 60 18, 160 12" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"></path></svg></span></h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #3A3A36; max-width: 36ch">Text Bao on WhatsApp. Get picks you trust in SF, and exactly what to order.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px">
<a href="#" style="height: 58px; padding: 0 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Get early access</a>
</div>
</div>

<div aria-hidden="true" style="position: relative; width: 100%; max-width: 460px; aspect-ratio: 460 / 540; justify-self: center">
<img class="food" src="img/dish-1.webp" alt="" style="left: 0; top: 2%; width: 44%; --r: -10deg; animation-delay: -1s">
<img class="food" src="img/dish-3.webp" alt="" style="right: 0; top: 22%; width: 46%; --r: 12deg; animation-delay: -3.5s">
<img class="food" src="img/dish-2.webp" alt="" style="left: 12%; top: 52%; width: 54%; --r: -4deg; animation-delay: -2s">
</div>

</main>

<footer style="display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: #555550; padding: 12px 0 20px"><span>© 2026 Bao</span><a href="#">Privacy</a><a href="#">Terms</a><span>hello@[domain]</span></footer>

</div>
</div>
</body>
</html>
